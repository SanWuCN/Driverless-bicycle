name: firmware-build

on:
  push:
  pull_request:

jobs:
  arm-gcc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build

      - name: Configure
        run: cmake --preset mac-debug

      - name: Build
        run: cmake --build --preset mac-debug

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bike-firmware
          path: |
            build/debug/bike.elf
            build/debug/bike.hex
            build/debug/bike.bin
            build/debug/bike.map

  windows-control-station:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-control-station.txt

      - name: Build Windows application
        shell: pwsh
        run: ./tools/build_control_station_windows.ps1

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: BikeControlStation-Windows-x64
          path: dist/BikeControlStation-Windows-x64.zip
          if-no-files-found: error
